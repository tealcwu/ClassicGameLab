<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pong · 8 区反弹交互验证</title>
<style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#eaf1fb;background:#101722}*{box-sizing:border-box}body{margin:0;padding:24px 16px}.wrap{max-width:880px;margin:auto}h1{font-size:clamp(24px,4vw,34px);margin:0 0 12px}p{color:#aebed0;line-height:1.65}.panel{background:#192638;border:1px solid #3a5068;border-radius:16px;padding:clamp(12px,3vw,22px)}svg{display:block;width:100%;height:auto;background:#0d1724;border-radius:12px;touch-action:none;cursor:crosshair}input[type=range]{width:100%;accent-color:#64d6b2}.controls{display:flex;align-items:center;gap:14px;margin-top:16px}button{background:#36506b;border:0;border-radius:8px;color:#fff;padding:10px 16px;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}.stat{background:#101c2b;border-radius:10px;padding:13px}.stat span{display:block;font-size:13px;color:#aebed0}.stat strong{display:block;font-size:23px;margin-top:6px}small{display:block;margin-top:14px;color:#aebed0;line-height:1.65}.legend{color:#8ee7c6}.note{font-size:14px}@media(max-width:550px){.stats{gap:6px}.stat{padding:8px}.stat strong{font-size:18px}.stat span{font-size:11px}}
</style>
</head>
<body><main class="wrap">
<h1>#001 Pong · 8 区分区反弹</h1>
<p>拖动滑块或直接点击球拍上的任意位置，观察碰撞点如何决定区域、反弹角度与方向向量。左侧球拍将球反弹到右侧。</p>
<div class="panel">
<svg id="scene" viewBox="0 0 800 400" role="img" aria-label="Pong 球拍八个碰撞分区及反弹方向示意">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#70e1b3"/></marker></defs>
<line x1="0" y1="200" x2="800" y2="200" stroke="#30445a" stroke-dasharray="7 9"/>
<text x="30" y="30" fill="#c7d6e6" font-size="17">左侧 Paddle · 向右反弹</text>
<g id="zones"></g><g id="trajectory"></g>
<circle id="ball" cx="149" cy="200" r="10" fill="#fff" stroke="#d4e5f6" stroke-width="2"/>
</svg>
<div class="controls"><input id="slider" aria-label="击中位置，从底到顶" type="range" min="0" max="1" step="0.001" value="0.62"><button id="reset" type="button">重置</button></div>
<div class="stats"><div class="stat"><span>归一化位置（底→顶）</span><strong id="normalized">0.620</strong></div><div class="stat"><span>分区（底→顶）</span><strong id="zoneNumber">5 / 8</strong></div><div class="stat"><span>反弹角度</span><strong id="angleText">0°</strong></div></div>
<small class="legend" id="vectorText">方向向量：(1.000, 0.000)</small>
<small class="note">角度表（从底到顶）：−60°、−45°、−30°、0°、0°、30°、45°、60°。这是用于学习的示例映射，不代表 1972 年 Pong 原版硬件的精确参数。角度相对于向右的水平线，正角度向上。</small>
</div></main>
<script>
'use strict';
const angles=[-60,-45,-30,0,0,30,45,60];
const svg=document.getElementById('scene');
const slider=document.getElementById('slider');
const zones=document.getElementById('zones');
const trajectory=document.getElementById('trajectory');
const ball=document.getElementById('ball');
const paddle={x:112,y:58,width:24,height:284};
const NS='http://www.w3.org/2000/svg';
function element(tag,attrs,text){const node=document.createElementNS(NS,tag);for(const [key,value] of Object.entries(attrs))node.setAttribute(key,String(value));if(text!==undefined)node.textContent=String(text);return node;}
function draw(){
 const u=Math.max(0,Math.min(1,Number(slider.value)));
 const index=Math.min(7,Math.floor(u*8));
 const angle=angles[index];
 const radians=angle*Math.PI/180;
 const dx=Math.cos(radians),dy=Math.sin(radians);
 const y=paddle.y+(1-u)*paddle.height;
 zones.replaceChildren();
 for(let i=7;i>=0;i--){
  const yTop=paddle.y+(7-i)*paddle.height/8;
  zones.appendChild(element('rect',{x:paddle.x,y:yTop,width:paddle.width,height:paddle.height/8-1,rx:2,fill:i===index?'#f3bb69':'#526b84',stroke:i===index?'#ffe0a5':'#738aa2','stroke-width':i===index?1.5:0.4}));
  zones.appendChild(element('text',{x:paddle.x-12,y:yTop+paddle.height/16+5,'text-anchor':'end','font-size':15,fill:i===index?'#f3bb69':'#b5c6d8'},i+1));
 }
 const bx=paddle.x+paddle.width+13;
 ball.setAttribute('cx',bx);ball.setAttribute('cy',y);
 trajectory.replaceChildren();
 const length=235;
 const x2=bx+length*dx,y2=y-length*dy;
 trajectory.appendChild(element('line',{x1:bx,y1:y,x2:x2,y2:y2,stroke:'#70e1b3','stroke-width':4,'stroke-linecap':'round','marker-end':'url(#arrow)'}));
 trajectory.appendChild(element('line',{x1:bx,y1:y,x2:bx+length,y2:y,stroke:'#58708a','stroke-width':1.5,'stroke-dasharray':'5 7'}));
 trajectory.appendChild(element('circle',{cx:paddle.x+paddle.width,cy:y,r:5,fill:'#ffdd98'}));
 trajectory.appendChild(element('text',{x:420,y:34,fill:'#8ee7c6','font-size':16},'角度 '+(angle>0?'+':'')+angle+'°'));
 document.getElementById('normalized').textContent=u.toFixed(3);
 document.getElementById('zoneNumber').textContent=(index+1)+' / 8';
 document.getElementById('angleText').textContent=(angle>0?'+':'')+angle+'°';
 document.getElementById('vectorText').textContent='方向向量：('+dx.toFixed(3)+', '+dy.toFixed(3)+')';
}
slider.addEventListener('input',draw);
document.getElementById('reset').addEventListener('click',()=>{slider.value='0.62';draw();});
svg.addEventListener('pointerdown',event=>{
 const matrix=svg.getScreenCTM();if(!matrix)return;
 const point=svg.createSVGPoint();point.x=event.clientX;point.y=event.clientY;
 const local=point.matrixTransform(matrix.inverse());
 slider.value=String(Math.max(0,Math.min(1,1-(local.y-paddle.y)/paddle.height)));
 draw();
});
draw();
</script>
</body></html>
